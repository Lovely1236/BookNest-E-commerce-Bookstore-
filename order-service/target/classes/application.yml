server:
  port: 8084

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:mysql://mysql:3306/order_db
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

openapi:
  server:
    url: ${OPENAPI_SERVER_URL:http://localhost:8080/api/order}

# RabbitMQ
spring:
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

notification:
  exchange: notifications.exchange
  routing-key: notifications.routingkey
