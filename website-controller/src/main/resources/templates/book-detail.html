<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Book Detail</title>
    <link rel="stylesheet" th:href="@{/css/site.css}">
</head>
<body>
<div th:replace="~{fragments :: nav}"></div>
<main class="page detail-layout">
    <section class="card">
        <h1 th:text="${book['bookTitle'] ?: book['title'] ?: 'Selected Book'}">Selected Book</h1>
        <p th:text="${book['bookAuthor'] ?: book['author'] ?: 'Unknown Author'}">Author</p>
        <p class="muted">Average Rating: <span th:text="${averageRating}">0.0</span></p>

        <form action="/cart/add" method="post" class="inline-form">
            <input type="hidden" name="bookId" th:value="${book['bookId'] ?: book['id'] ?: 1}">
            <input type="number" name="quantity" value="1" min="1">
            <button class="button" type="submit">Add to Cart</button>
        </form>

        <form action="/wishlist/add" method="post" class="inline-form">
            <input type="hidden" name="bookId" th:value="${book['bookId'] ?: book['id'] ?: 1}">
            <input type="hidden" name="bookTitle" th:value="${book['bookTitle'] ?: book['title'] ?: 'Selected Book'}">
            <input type="hidden" name="bookPrice" th:value="${book['bookPrice'] ?: book['price'] ?: 0}">
            <button class="button secondary" type="submit">Save to Wishlist</button>
        </form>
    </section>

    <section class="card">
        <h2>Write a Review</h2>
        <form action="/review/add" method="post" class="form-grid">
            <input type="hidden" name="bookId" th:value="${book['bookId'] ?: book['id'] ?: 1}">
            <input name="rating" type="number" min="1" max="5" value="5" placeholder="Rating">
            <textarea name="comment" placeholder="Share your thoughts"></textarea>
            <button class="button" type="submit">Post Review</button>
        </form>
    </section>

    <section class="card full-width">
        <h2>Reviews</h2>
        <div class="list">
            <article class="list-item" th:each="review : ${reviews}">
                <strong th:text="${review['rating']}">5</strong>
                <p th:text="${review['comment']}">Great read.</p>
                <span class="muted">User <span th:text="${review['userId']}">1</span></span>
            </article>
        </div>
    </section>
</main>
</body>
</html>
