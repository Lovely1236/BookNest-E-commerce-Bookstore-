<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Book</title>
    <link rel="stylesheet" th:href="@{/css/site.css}">
</head>
<body>
<div th:replace="~{fragments :: nav('admin')}"></div>
<div th:replace="~{fragments :: flash}"></div>
<main class="page narrow">
    <section class="card">
        <p class="eyebrow">Admin Catalog</p>
        <h1>Add Book</h1>
        <form action="/admin/addBook" method="post" class="form-grid">
            <div class="field-grid">
                <div>
                    <label for="title">Title</label>
                    <input id="title" name="title" required>
                </div>
                <div>
                    <label for="author">Author</label>
                    <input id="author" name="author" required>
                </div>
                <div>
                    <label for="isbn">ISBN</label>
                    <input id="isbn" name="isbn">
                </div>
                <div>
                    <label for="genre">Genre</label>
                    <input id="genre" name="genre">
                </div>
                <div>
                    <label for="publisher">Publisher</label>
                    <input id="publisher" name="publisher">
                </div>
                <div>
                    <label for="publishedDate">Published Date</label>
                    <input id="publishedDate" type="date" name="publishedDate">
                </div>
                <div>
                    <label for="price">Price</label>
                    <input id="price" type="number" step="0.01" min="0.01" name="price" required>
                </div>
                <div>
                    <label for="stock">Stock</label>
                    <input id="stock" type="number" min="0" name="stock" required>
                </div>
                <div>
                    <label for="rating">Rating</label>
                    <input id="rating" type="number" min="0" max="5" step="0.1" name="rating" value="0">
                </div>
                <div>
                    <label for="coverImageUrl">Cover Image URL</label>
                    <input id="coverImageUrl" name="coverImageUrl">
                </div>
            </div>
            <div>
                <label for="description">Description</label>
                <textarea id="description" name="description"></textarea>
            </div>
            <div class="actions">
                <button class="button" type="submit">Create Book</button>
                <a class="button ghost" th:href="@{/admin/inventory}">Open Inventory</a>
            </div>
        </form>
    </section>
</main>
</body>
</html>
