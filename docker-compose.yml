version: '3.8'

services:

  # ---------------- MYSQL ----------------
  mysql:
   image: mysql:8
   container_name: booknest-mysql
   restart: always
   environment:
     MYSQL_ROOT_PASSWORD: root
     MYSQL_DATABASE: booknest_auth
   ports:
    - "3307:3306"
   volumes:
    - mysql_data:/var/lib/mysql# ---------------- EUREKA ----------------
  eureka-server:
    build: ./eureka-server
    container_name: eureka-server
    ports:
      - "8761:8761"

  # ---------------- AUTH SERVICE ----------------
  auth-service:
    build: ./auth-service
    container_name: auth-service
    depends_on:
      - mysql
      - eureka-server
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/booknest_auth
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/

  # ---------------- BOOK SERVICE ----------------
  book-service:
    build: ./book-service
    container_name: book-service
    depends_on:
      - eureka-server
    ports:
      - "8082:8082"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/

volumes:
  mysql_data: