spring:
  application:
    name: admin-service

server:
  port: 8095

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

openapi:
  server:
    # Default to admin-service local port so Swagger shows localhost:8095
    url: ${OPENAPI_SERVER_URL:http://localhost:8095/api}

